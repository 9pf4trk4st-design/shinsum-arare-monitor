name: Shinsum Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"
    - cron: "50 4 * * *"
    - cron: "40 10 * * *"

permissions:
  contents: read

concurrency:
  group: shinsum-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Run Shinsum Monitor
        env:
          TZ: Asia/Tokyo
          SHINSUM_USER: ${{ secrets.SHINSUM_USER }}
          SHINSUM_PASSWORD: ${{ secrets.SHINSUM_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CHECK_INTERVAL: "120"
          PYTHONUNBUFFERED: "1"

        run: python monitor.py
