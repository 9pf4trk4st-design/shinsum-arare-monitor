name: ANA Middle/Longshot Bot

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions の cron は UTC
    # 日本時間 08:00～22:59 をカバー
    # 5分間隔で起動
    - cron: "*/5 23 * * *"
    - cron: "*/5 0-13 * * *"

permissions:
  contents: read

concurrency:
  group: ana-middle-longshot-bot
  cancel-in-progress: false

jobs:
  run-ana-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements_ana_bot.txt ]; then
            pip install -r requirements_ana_bot.txt
          else
            pip install requests beautifulsoup4 lxml playwright
          fi

          python -m playwright install --with-deps chromium

      - name: Run ANA Middle/Longshot Bot
        env:
          TZ: Asia/Tokyo

          # ntfy通知
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

          # 必要な場合に使用
          SHINSUM_ID: ${{ secrets.SHINSUM_ID }}
          SHINSUM_PASSWORD: ${{ secrets.SHINSUM_PASSWORD }}

          PYTHONUNBUFFERED: "1"

        run: |
          echo "======================================"
          echo " ANA Middle/Longshot Bot START"
          echo " JST: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S')"
          echo "======================================"

          python ana_bot_v2_all_days.py

          echo "======================================"
          echo " ANA Middle/Longshot Bot END"
          echo " JST: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S')"
          echo "======================================"
