name: ANA Middle/Longshot Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"
    - cron: "50 4 * * *"
    - cron: "40 10 * * *"

permissions:
  contents: read

concurrency:
  group: ana-middle-longshot-bot
  cancel-in-progress: true

jobs:
  run-ana-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements_ana_bot.txt

      - name: Run ANA Bot
        env:
          TZ: Asia/Tokyo
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CHECK_INTERVAL: "120"
          ANA_ALLOWED_DAYS: "1,2,3,4,5,6,7"
          ANA_MID_SCORE: "5.0"
          ANA_BIG_SCORE: "7.0"
          PYTHONUNBUFFERED: "1"

        run: python ana_bot_v3_all_days_retry.py
