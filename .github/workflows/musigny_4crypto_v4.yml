name: Musigny Crypto BOT v11.4

on:
  workflow_dispatch:

  schedule:
    # 毎時0分に起動
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: musigny-crypto-bot-v11-4
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    # 1時間以内を目安に終了
    timeout-minutes: 65

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Musigny Crypto BOT every 5 minutes
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

          # 仮想残高
          PAPER_BALANCE: "100000"

          # 1回の許容リスク 0.75%
          RISK_PCT: "0.0075"

          # ペーパー上の最大レバレッジ 10倍
          MAX_LEVERAGE: "10"

          # 最大同時保有数
          MAX_OPEN_POSITIONS: "2"

          # エントリー基準
          ENTRY_THRESHOLD: "62"
          STRONG_THRESHOLD: "72"
          OPPOSITE_GAP: "10"

          # 損失制限
          MAX_DAILY_LOSS_PCT: "0.03"
          MAX_CONSECUTIVE_LOSSES: "3"

          # 待機注文
          PENDING_EXPIRE_HOURS: "1.5"

          # スイング区間判定
          SWING_MAX_DISTANCE_PCT: "0.10"
          SWING_MIN_WIDTH_PCT: "0.008"

          # SHORTは区間上側40%から
          SHORT_ENTRY_MIN_POS: "0.60"

          # LONGは区間下側40%から
          LONG_ENTRY_MAX_POS: "0.40"

          # STOP余白
          SWING_STOP_PAD_PCT: "0.10"

        run: |
          set -u

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for i in $(seq 1 10)
          do
            echo "========================================"
            echo "Musigny Crypto check $i / 10"
            date -u
            echo "========================================"

            # BOT実行
            python main.py || echo "[WARN] main.py returned an error, continuing next cycle"

            # stateを保存
            git add state/ 2>/dev/null || true

            if ! git diff --cached --quiet
            then
              git commit -m "Update Musigny crypto virtual trade state" || true

              # リモート側に変更があった場合も対応
              git pull --rebase origin main || true

              # push失敗時は少し待って再試行
              git push origin main || {
                echo "[WARN] push failed. retrying..."
                sleep 5
                git pull --rebase origin main || true
                git push origin main || true
              }
            else
              echo "No state changes"
            fi

            # 最終回はsleepしない
            if [ "$i" -lt 10 ]
            then
              echo "Next check in 5 minutes..."
              sleep 300
            fi
          done

      - name: Final status
        if: always()
        run: |
          echo "Musigny Crypto BOT monitoring cycle finished."
