name: Musigny 4Crypto Daytrade Bot v4

on:
  workflow_dispatch:
  schedule:
    # 5分おき・24時間・毎日
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: musigny-4crypto-daytrade-v4
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run Musigny bot
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py

      - name: Save virtual trade state
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add state.json

            if ! git diff --cached --quiet; then
              git commit -m "Update virtual trade state"
              git push
            else
              echo "No state changes"
            fi
          else
            echo "state.json not found"
          fi

      - name: Delete old workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_IDS=$(gh run list \
            --workflow="musigny_4crypto_v4.yml" \
            --limit 100 \
            --json databaseId \
            --jq '.[10:] | .[].databaseId')

          if [ -n "$RUN_IDS" ]; then
            for RUN_ID in $RUN_IDS; do
              echo "Deleting old workflow run: $RUN_ID"
              gh run delete "$RUN_ID"
            done
          else
            echo "No old workflow runs to delete"
         
