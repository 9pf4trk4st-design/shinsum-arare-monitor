name: Musigny 4Crypto Daytrade Bot v4

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: musigny-4crypto-daytrade-v4
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Run Musigny bot every 5 minutes
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PYTHONUNBUFFERED: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for i in $(seq 1 12); do
            echo "========================================"
            echo "Musigny check $i / 12"
            date -u
            echo "========================================"

            python main.py

            git add state/ 2>/dev/null || true

            if ! git diff --cached --quiet; then
              git commit -m "Update Musigny virtual trade state"
              git pull --rebase origin main || true
              git push origin HEAD:main || true
            else
              echo "No state changes"
            fi

            if [ "$i" -lt 12 ]; then
              echo "Next check in 5 minutes..."
              sleep 300
            fi
          done

      - name: Delete old workflow runs
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list \
            --workflow musigny_4crypto_v4.yml \
            --limit 100 \
            --json databaseId \
            --jq '.[10:][].databaseId' > old_runs.txt

          while IFS= read -r RUN_ID; do
            if [ -n "$RUN_ID" ]; then
              echo "Deleting old workflow run: $RUN_ID"
              gh run delete "$RUN_ID" || true
            fi
          done < old_runs.txt

      - name: Start next monitoring cycle
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Starting next Musigny monitoring cycle"
          gh workflow run musigny_4crypto_v4.yml --ref main
