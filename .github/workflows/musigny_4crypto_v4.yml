name: Musigny 4Crypto Daytrade Bot v4

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: musigny-4crypto-daytrade-v4
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Run Musigny bot
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py

      - name: Save virtual trade state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/

          if ! git diff --cached --quiet; then
            git commit -m "Update Musigny virtual trade state"
            git push
          else
            echo "No state changes"
          fi

      - name: Delete old workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list \
            --workflow musigny_4crypto_v4.yml \
            --limit 100 \
            --json databaseId \
            --jq '.[10:][].databaseId' > old_runs.txt

          while read RUN_ID; do
            if [ -n "$RUN_ID" ]; then
              echo "Deleting run $RUN_ID"
              gh run delete "$RUN_ID"
            fi
          done < old_runs.txt
